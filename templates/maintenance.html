<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FirstCutLaser - Održavanje</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0c10; font-family: 'Plus Jakarta Sans', sans-serif; color: #e2e8f0; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0; }
        .maint-container { text-align: center; padding: 40px; background: #12141c; border-radius: 20px; border-top: 6px solid #ef4444; box-shadow: 0 15px 40px rgba(0,0,0,0.6); max-width: 500px; width: 90%; position: relative; }
        .logo-img { height: 70px; margin-bottom: 30px; cursor: pointer; user-select: none; -webkit-user-drag: none; transition: transform 0.2s; }
        .logo-img:active { transform: scale(0.95); }
        .gears { font-size: 3.5rem; color: #38bdf8; margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; }
        .gears i:nth-child(1) { animation: spinRight 4s linear infinite; }
        .gears i:nth-child(2) { animation: spinLeft 4s linear infinite; font-size: 2.5rem; margin-top: 15px; color: #64748b; }
        @keyframes spinRight { 100% { transform: rotate(360deg); } }
        @keyframes spinLeft { 100% { transform: rotate(-360deg); } }
        h1 { font-weight: 800; font-size: 1.8rem; letter-spacing: 1px; color: #ffffff; }
        p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 0; }
        
        #hidden-login { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #12141c; border-radius: 20px; z-index: 10; padding: 40px; box-sizing: border-box; }
        
        .form-control::placeholder { color: #94a3b8 !important; opacity: 1; font-weight: 500; }
        .form-control { background-color: #1a1e2b; border: 1px solid #2d3446; color: #ffffff; border-radius: 8px; padding: 12px 16px; font-size: 1rem; }
        .form-control:focus { background-color: #23293b; border-color: #ef4444; color: #fff; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15); outline: none; }
    </style>
</head>
<body>
    <div class="maint-container">
        <img src="/logo.png" alt="First Cut Laser" class="logo-img" id="secret-logo">
        <div class="gears">
            <i class="fa-solid fa-gear"></i>
            <i class="fa-solid fa-gear"></i>
        </div>
        <h1>SUSTAV JE POD ODRŽAVANJEM</h1>
        <p class="mt-3">Trenutno izvodimo sigurnosnu nadogradnju i optimizaciju pogona.</p>
        <p class="mt-2 text-danger fw-bold">Molimo pričekajte.</p>

        <div id="hidden-login">
            <h4 class="text-danger fw-bold mb-4"><i class="fa-solid fa-terminal me-2"></i> DEV ACCESS</h4>
            <form action="/skriveni_dev_login" method="POST">
                <input type="password" name="password" class="form-control mb-4" placeholder="Unesi pristupni ključ..." required autofocus>
                <button type="submit" class="btn btn-danger w-100 fw-bold py-2 shadow-sm mb-3">OTKLJUČAJ SUSTAV</button>
                <button type="button" class="btn btn-outline-secondary text-white fw-bold w-100 py-2 rounded-pill border-2" onclick="document.getElementById('hidden-login').style.display='none';"><i class="fa-solid fa-arrow-left me-2"></i> Odustani i vrati se</button>
            </form>
        </div>
    </div>

    <script>
        let clickCount = 0;
        let clickTimer;
        document.getElementById('secret-logo').addEventListener('click', function() {
            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 1500);
            if (clickCount >= 5) {
                document.getElementById('hidden-login').style.display = 'block';
                clickCount = 0;
            }
        });
    </script>
</body>
</html>
