{% extends "base.html" %}
{% block login_content %}
<div class="login-wrapper">
    <div class="login-box text-center" style="border-top-color: #ef4444;">
        <img src="/logo.png" class="mb-3 mt-1" style="max-height: 62px;" alt="FirstCutLaser">
        <div class="mb-4">
            <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 px-3 py-1 mb-2">
                <i class="fa-solid fa-shield-halved me-1"></i>REGISTRACIJA TERMINALA
            </span>
            <h4 class="fw-bold text-white mb-1">Pristup Pogonu</h4>
            <p class="text-muted small mb-0">Odaberite ulogu ovog računala ili mobilnog uređaja</p>
        </div>
        {% if blokada_aktivna %}
            <div class="alert alert-danger p-3 fw-bold fs-5 shadow-sm border border-danger">
                <i class="fa-solid fa-lock me-2 text-danger"></i> ZABRANJEN PRISTUP<br>
                <small class="fs-6 fw-normal d-block mt-2 text-white">{{ poruka }}</small>
            </div>
        {% else %}
            {% if poruka %}
                <div class="alert alert-warning py-2 small fw-bold text-dark border border-warning">{{ poruka }}</div>
            {% endif %}
            <form method="POST">
                <div class="mb-3 text-start">
                    <label class="form-label"><i class="fa-solid fa-desktop text-danger me-1"></i> Vrsta uređaja / Radna stanica</label>
                    <select name="vrsta_stanice" class="form-control fw-bold" style="cursor: pointer;">
                        <option value="uprava">Slobodan Pristup (Uprava / Poslovođa)</option>
                        <option value="monitor">Monitor Pogona (Centralni zaslon)</option>
                        <option value="laser1">Stanica 1: Laser 1 (Glavni)</option>
                        <option value="laser2">Stanica 1: Laser 2</option>
                        <option value="bravarija">Stanica 2: Bravarija</option>
                    </select>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label"><i class="fa-solid fa-lock text-danger me-1"></i> Sigurnosni PIN Pogona</label>
                    <input type="password" class="form-control text-center fs-5 fw-bold" name="pin" placeholder="••••" required autocomplete="off" inputmode="numeric" pattern="[0-9]*" style="letter-spacing: 6px;">
                </div>
                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold mb-2 text-uppercase shadow" style="border-radius: 10px;">
                    <i class="fa-solid fa-unlock-keyhole me-2"></i>Otključaj Sustav
                </button>
            </form>
        {% endif %}
    </div>
</div>
{% endblock %}
